<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DutchMate · Feature 015 popup mockup</title>
  <link rel="stylesheet" href="../../src/design-system/dutchmate-tokens.css">
  <link rel="stylesheet" href="../../src/design-system/primitives.css">
  <style>
    :root { font-family: var(--dm-font-ui); color: var(--dm-ink-strong); background: #eee8e2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #fff9f2 0, #eee8e2 52%, #ddd5cc 100%); }
    button { font: inherit; cursor: pointer; }
    .prototype-canvas { min-height: 100vh; padding: 18px 18px 90px; }
    .prototype-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 980px; margin: 0 auto 14px; color: var(--dm-ink-muted); font-size: var(--dm-font-size-small); }
    .prototype-toolbar strong { color: var(--dm-ink-strong); letter-spacing: .04em; text-transform: uppercase; }
    .prototype-toolbar .toolbar-copy { display: grid; gap: 2px; }
    .prototype-toolbar .toolbar-note { color: var(--dm-brand-orange-deep); }
    .popup-stage { display: grid; place-items: start center; min-height: 600px; }
    .popup-shell { display: flex; flex-direction: column; width: var(--dm-popup-width); height: var(--dm-popup-height); overflow: hidden; border: 1px solid var(--dm-line); border-radius: 8px; background: var(--dm-paper); box-shadow: var(--dm-shadow-high); }
    .popup-header { display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 10px 16px; border-bottom: 1px solid var(--dm-line); background: var(--dm-paper-raised); }
    .brand { display: flex; align-items: center; gap: 9px; color: var(--dm-ink-strong); font-weight: var(--dm-weight-black); letter-spacing: -.02em; }
    .brand img { width: 29px; height: 29px; border-radius: var(--dm-radius-control); }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .header-button, .header-link { min-height: var(--dm-target-min); padding: 4px; border: 0; border-radius: 6px; background: transparent; color: var(--dm-ink-muted); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-bold); }
    .header-button:hover, .header-link:hover { color: var(--dm-ink-strong); text-decoration: underline; text-decoration-color: var(--dm-brand-orange); text-underline-offset: 3px; }
    .due-badge { display: inline-grid; min-width: 24px; height: 24px; place-items: center; border-radius: 50%; background: var(--dm-brand-orange); color: var(--dm-ink-strong); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-black); }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--dm-ink-strong); background: var(--dm-paper-raised); }
    .tab { min-height: var(--dm-target-min); border: 0; border-right: 1px solid var(--dm-ink-strong); background: var(--dm-paper-raised); color: var(--dm-ink-strong); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-black); letter-spacing: .04em; text-transform: uppercase; }
    .tab:last-child { border-right: 0; }
    .tab.is-active { background: var(--dm-ink-strong); color: var(--dm-paper-raised); }
    .tab:disabled { cursor: default; opacity: .62; }
    .popup-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px; background: var(--dm-paper); }
    .popup-content.focused { padding: 2px 16px 16px; }
    .content { display: grid; align-content: start; gap: 12px; }
    .eyebrow, .section-title, .stat-label { margin: 0; color: var(--dm-brand-orange-deep); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-black); letter-spacing: .04em; text-transform: uppercase; }
    .heading { margin: 0; color: var(--dm-ink-strong); font-family: var(--dm-font-reading); font-size: var(--dm-font-size-h1); font-weight: var(--dm-weight-black); line-height: var(--dm-line-height-h1); }
    .subheading { margin: 0; color: var(--dm-ink-strong); font-family: var(--dm-font-reading); font-size: var(--dm-font-size-h2); font-weight: var(--dm-weight-black); line-height: var(--dm-line-height-h2); }
    .body-copy, .helper-copy, .local-note { margin: 0; color: var(--dm-ink-muted); font-family: var(--dm-font-reading); font-size: var(--dm-font-size-small); line-height: var(--dm-line-height-small); }
    .quiet-link { min-height: var(--dm-target-min); padding: 4px 0; border: 0; background: transparent; color: var(--dm-ink-strong); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-bold); text-align: left; text-decoration: underline; text-decoration-color: var(--dm-brand-orange); text-underline-offset: 3px; }
    .button { min-height: var(--dm-target-min); padding: 8px 10px; border: 1px solid var(--dm-ink-strong); border-radius: var(--dm-radius-control); background: var(--dm-paper-raised); color: var(--dm-ink-strong); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-bold); line-height: var(--dm-line-height-label); }
    .button.primary { background: var(--dm-brand-orange); }
    .button:hover, .button:focus-visible { background: var(--dm-paper-soft); }
    .button.primary:hover, .button.primary:focus-visible { background: var(--dm-ink-strong); color: var(--dm-paper-raised); }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .actions.single { grid-template-columns: 1fr; }
    .card, .next-action, .practice-card, .lesson-story { border: 1px solid var(--dm-ink-strong); border-radius: var(--dm-radius-card); background: var(--dm-paper-raised); box-shadow: var(--dm-shadow-low); }
    .card { display: grid; gap: 7px; padding: 12px; }
    .next-action { display: grid; gap: 7px; padding: 12px; border-left: 6px solid var(--dm-brand-orange); }
    .next-action .heading { font-family: var(--dm-font-ui); font-size: 1.35rem; line-height: 1.08; }
    .next-action .button { width: 100%; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { display: grid; gap: 5px; min-height: 60px; padding: 9px 8px; border: 1px solid var(--dm-line); border-top: 4px solid var(--dm-brand-orange); background: var(--dm-paper-raised); }
    .stat strong { font-family: var(--dm-font-reading); font-size: 1.35rem; line-height: 1; }
    .stat-label { color: var(--dm-ink-muted); font-size: .6rem; }
    .rhythm { display: grid; gap: 7px; padding: 8px 0; border-top: 1px solid var(--dm-line); border-bottom: 1px solid var(--dm-line); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .section-head strong { font-family: var(--dm-font-reading); font-size: 1rem; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .rhythm-day { min-height: 39px; padding: 4px; border: 0; border-radius: 8px; background: var(--dm-paper-soft); color: var(--dm-ink-strong); font-size: .58rem; font-weight: var(--dm-weight-black); }
    .rhythm-day.active { background: color-mix(in srgb, var(--dm-brand-orange) 58%, var(--dm-paper-raised)); }
    .rhythm-day.high { background: var(--dm-brand-orange); }
    .rhythm-day.today { box-shadow: inset 0 0 0 2px var(--dm-ink-strong); }
    .lesson-filters { display: flex; gap: 4px; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--dm-line); border-bottom: 1px solid var(--dm-line); }
    .filter { min-height: var(--dm-target-min); padding: 2px 8px; border: 1px solid var(--dm-line); border-radius: 6px; background: var(--dm-paper-raised); font-size: .63rem; font-weight: var(--dm-weight-black); }
    .filter.active { border-color: var(--dm-ink-strong); background: var(--dm-ink-strong); color: var(--dm-paper-raised); }
    .lesson-list { display: grid; gap: 0; border-top: 3px solid var(--dm-ink-strong); }
    .lesson-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; min-height: var(--dm-target-min); padding: 7px 5px; border: 0; border-bottom: 1px solid var(--dm-line); border-radius: 8px; background: var(--dm-paper-raised); color: var(--dm-ink-strong); text-align: left; }
    .lesson-row:hover, .lesson-row:focus-visible { background: var(--dm-paper-soft); box-shadow: inset 4px 0 var(--dm-brand-orange); }
    .lesson-row strong { overflow: hidden; font-family: var(--dm-font-reading); font-size: .84rem; text-overflow: ellipsis; white-space: nowrap; }
    .lesson-row small { display: block; margin-top: 3px; color: var(--dm-ink-muted); font-size: .61rem; }
    .lesson-number { font-family: var(--dm-font-reading); font-size: 1rem; }
    .level, .tag { display: inline-block; padding: 4px 6px; border: 1px solid var(--dm-line); border-radius: 6px; color: var(--dm-ink-muted); font-size: .58rem; font-weight: var(--dm-weight-black); white-space: nowrap; }
    .tag.orange { border-color: var(--dm-brand-orange); color: var(--dm-brand-orange-deep); }
    .lesson-rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-bottom: 12px; }
    .lesson-stage { display: grid; min-height: var(--dm-target-min); place-items: center; padding: 4px 2px; border: 1px solid var(--dm-ink-strong); background: var(--dm-paper-raised); color: var(--dm-ink-strong); font-size: .58rem; font-weight: var(--dm-weight-black); line-height: var(--dm-line-height-small); text-align: center; text-transform: uppercase; }
    .lesson-stage.active { background: var(--dm-ink-strong); color: var(--dm-paper-raised); }
    .lesson-story { display: grid; gap: 9px; padding: 12px; border-top: 5px solid var(--dm-brand-orange); }
    .story-line { display: grid; gap: 4px; padding: 7px 0; border-bottom: 1px solid var(--dm-line); }
    .story-line:last-child { border-bottom: 0; }
    .story-dutch { margin: 0; font-family: var(--dm-font-reading); font-size: .94rem; line-height: 1.4; }
    .pattern-highlight { padding: 1px 3px; border-radius: 3px; background: var(--dm-brand-orange); color: var(--dm-ink-strong); }
    .notice { padding: 9px 10px; border-left: 4px solid var(--dm-brand-orange); border-radius: 0 var(--dm-radius-control) var(--dm-radius-control) 0; background: var(--dm-paper-soft); color: var(--dm-ink-muted); font-family: var(--dm-font-reading); font-size: var(--dm-font-size-small); line-height: var(--dm-line-height-small); }
    .pattern-stack { display: grid; gap: 7px; }
    .pattern-line { padding: 9px; border: 1px solid var(--dm-line); border-radius: var(--dm-radius-control); background: var(--dm-paper-raised); }
    .pattern-line strong { display: block; margin: 4px 0; font-family: var(--dm-font-reading); font-size: .92rem; }
    .map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .map-cell { min-height: 88px; padding: 8px; border: 1px solid var(--dm-line); border-radius: var(--dm-radius-control); background: var(--dm-paper-raised); color: var(--dm-ink-strong); text-align: left; }
    .map-cell.current { border: 3px solid var(--dm-ink-strong); background: var(--dm-paper-soft); }
    .map-cell.reference { border-style: dashed; color: var(--dm-ink-muted); }
    .map-cell strong, .map-cell span { display: block; }
    .map-cell .full { margin-top: 4px; color: var(--dm-ink-muted); font-size: .57rem; line-height: 1.2; }
    .map-cell .example { margin-top: 7px; font-family: var(--dm-font-reading); font-size: .72rem; }
    .map-detail { display: grid; gap: 7px; padding: 10px; border: 1px solid var(--dm-ink-strong); border-left: 5px solid var(--dm-brand-orange); border-radius: var(--dm-radius-card); background: var(--dm-paper-raised); }
    .map-detail strong { font-family: var(--dm-font-reading); }
    .detail-grid { display: grid; gap: 7px; }
    .detail-grid div { display: grid; gap: 2px; padding-top: 6px; border-top: 1px solid var(--dm-line); }
    .detail-grid label { color: var(--dm-ink-muted); font-size: .59rem; font-weight: var(--dm-weight-black); letter-spacing: .04em; text-transform: uppercase; }
    .detail-grid span { font-family: var(--dm-font-reading); font-size: .72rem; line-height: 1.3; }
    .english-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .english-tab { min-height: var(--dm-target-min); border: 1px solid var(--dm-line); border-radius: 6px; background: var(--dm-paper-raised); font-size: .62rem; font-weight: var(--dm-weight-black); }
    .english-tab.active { border-color: var(--dm-ink-strong); background: var(--dm-ink-strong); color: var(--dm-paper-raised); }
    .english-list { display: grid; gap: 6px; }
    .english-row { border: 1px solid var(--dm-line); border-radius: var(--dm-radius-control); background: var(--dm-paper-raised); }
    .english-row > button { display: flex; align-items: start; justify-content: space-between; gap: 8px; width: 100%; min-height: var(--dm-target-min); padding: 9px; border: 0; background: transparent; color: var(--dm-ink-strong); text-align: left; }
    .english-row strong { font-family: var(--dm-font-reading); font-size: .73rem; }
    .english-row small { display: block; margin-top: 3px; color: var(--dm-ink-muted); font-size: .61rem; line-height: 1.25; }
    .english-detail { display: grid; gap: 5px; padding: 9px; border-top: 1px solid var(--dm-line); background: var(--dm-paper-soft); color: var(--dm-ink-muted); font-family: var(--dm-font-reading); font-size: .67rem; line-height: 1.35; }
    .practice-card { display: grid; gap: 10px; padding: 12px; border-top: 5px solid var(--dm-brand-orange); }
    .practice-progress { margin: 0; color: var(--dm-brand-orange-deep); font-size: var(--dm-font-size-label); font-weight: var(--dm-weight-black); letter-spacing: .04em; text-transform: uppercase; }
    .grammar-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .grammar-choices .button { min-height: var(--dm-target-min); padding: 7px 6px; overflow-wrap: anywhere; }
    .grammar-choices .is-selected { background: var(--dm-ink-strong); color: var(--dm-paper-raised); }
    .grammar-feedback { margin: 0; padding: 9px 10px; border-left: 4px solid var(--dm-brand-orange); border-radius: 0 var(--dm-radius-control) var(--dm-radius-control) 0; background: var(--dm-paper-soft); font-family: var(--dm-font-reading); font-size: var(--dm-font-size-small); line-height: var(--dm-line-height-small); }
    .grammar-order-answer, .slot-sentence { min-height: var(--dm-target-min); padding: 9px 10px; border: 1px dashed var(--dm-line); border-radius: var(--dm-radius-control); font-family: var(--dm-font-reading); font-size: .84rem; line-height: 1.35; }
    .slot-sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .slot { min-height: 34px; padding: 5px 7px; border: 1px dashed var(--dm-ink-muted); border-radius: 6px; background: var(--dm-paper); color: var(--dm-ink-muted); font-size: .73rem; }
    .slot.filled { border-style: solid; background: var(--dm-paper-soft); color: var(--dm-ink-strong); }
    .token-bank { display: flex; flex-wrap: wrap; gap: 6px; }
    .token-bank .button { min-height: 38px; padding: 6px 8px; }
    .token-bank .used { opacity: .4; }
    .order-zone { display: flex; flex-wrap: wrap; gap: 5px; min-height: var(--dm-target-min); padding: 8px; border: 1px dashed var(--dm-line); border-radius: var(--dm-radius-control); }
    .completion { display: grid; gap: 10px; text-align: center; }
    .completion-mark { display: grid; width: 54px; height: 54px; place-items: center; margin: 0 auto; border-radius: 50%; background: var(--dm-paper-soft); color: var(--dm-success); font-size: 1.6rem; font-weight: var(--dm-weight-black); }
    .check-list { display: grid; gap: 6px; text-align: left; }
    .check-row { display: grid; grid-template-columns: 22px 1fr; gap: 7px; align-items: start; font-family: var(--dm-font-reading); font-size: .72rem; line-height: 1.35; }
    .check { color: var(--dm-success); font-weight: var(--dm-weight-black); }
    .prototype-bottom { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 980px; margin: 14px auto 0; }
    .prototype-bottom button { min-height: 36px; padding: 5px 9px; border: 1px solid var(--dm-ink-strong); border-radius: var(--dm-radius-control); background: var(--dm-paper-raised); color: var(--dm-ink-strong); font-size: var(--dm-font-size-small); }
    .prototype-bottom .variant-label { min-width: 190px; color: var(--dm-ink-muted); font-size: var(--dm-font-size-small); text-align: center; }
    .feedback-toggle { position: fixed; right: 18px; bottom: 18px; z-index: 8; min-height: 44px; padding: 8px 12px; border: 1px solid var(--dm-ink-strong); border-radius: var(--dm-radius-control); background: var(--dm-ink-strong); color: var(--dm-paper-raised); box-shadow: var(--dm-shadow-high); font-size: var(--dm-font-size-small); font-weight: var(--dm-weight-bold); }
    .feedback-drawer { position: fixed; right: 18px; bottom: 70px; z-index: 7; display: none; width: min(350px, calc(100vw - 36px)); padding: 14px; border: 1px solid var(--dm-ink-strong); border-radius: var(--dm-radius-card); background: var(--dm-paper-raised); box-shadow: var(--dm-shadow-high); }
    .feedback-drawer.open { display: grid; gap: 8px; }
    .feedback-drawer h2 { margin: 0; font-family: var(--dm-font-reading); font-size: var(--dm-font-size-h2); }
    .feedback-drawer p { margin: 0; color: var(--dm-ink-muted); font-size: var(--dm-font-size-small); line-height: var(--dm-line-height-small); }
    .feedback-drawer textarea { width: 100%; min-height: 110px; padding: 8px; border: 1px solid var(--dm-line); border-radius: var(--dm-radius-control); background: var(--dm-paper-raised); color: var(--dm-ink-strong); font: var(--dm-font-size-small) / var(--dm-line-height-small) var(--dm-font-reading); resize: vertical; }
    .feedback-drawer .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 520px) {
      .prototype-canvas { padding: 0 0 80px; }
      .prototype-toolbar { margin: 0; padding: 10px 12px; background: var(--dm-paper-raised); }
      .popup-stage { min-height: auto; }
      .popup-shell { width: 100%; height: min(600px, calc(100vh - 70px)); min-height: 520px; border: 0; border-radius: 0; box-shadow: none; }
      .prototype-bottom { margin: 10px 0 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="prototype-canvas">
    <div class="prototype-toolbar">
      <div class="toolbar-copy"><strong>Feature 015 · popup mockup</strong><span class="toolbar-note">Real extension shell · throwaway prototype</span></div>
      <span>Use the controls below the popup to compare information hierarchy.</span>
    </div>
    <div class="popup-stage">
      <main id="popup" class="popup-shell" aria-label="DutchMate popup prototype"></main>
    </div>
    <div class="prototype-bottom" aria-label="Prototype variants">
      <button id="variantPrevious" type="button" aria-label="Previous mockup variant">←</button>
      <span id="variantLabel" class="variant-label"></span>
      <button id="variantNext" type="button" aria-label="Next mockup variant">→</button>
    </div>
  </div>

  <button id="feedbackToggle" class="feedback-toggle" type="button">Give feedback</button>
  <section id="feedbackDrawer" class="feedback-drawer" aria-label="Prototype feedback">
    <h2>Feedback</h2>
    <p>Notes stay in memory until copied. This mockup does not touch DutchMate data.</p>
    <textarea id="feedbackText" placeholder="What feels unlike the real popup? What should be moved, shortened, or removed?"></textarea>
    <div class="actions"><button id="clearFeedback" class="button" type="button">Clear note</button><button id="copyFeedback" class="button primary" type="button">Copy all feedback</button></div>
    <p id="feedbackState" aria-live="polite"></p>
  </section>

  <script>
    // Throwaway UI prototype: real popup-shaped shell, using the checked-in design tokens and popup interaction language.
    const variants = [
      { key: "today", name: "A · Today-led", description: "Today action first; closest to the existing daily rhythm." },
      { key: "lessons", name: "B · Lessons-led", description: "Lessons category and journey entry first." },
      { key: "map", name: "C · Map-led", description: "Verb Map is the anchor for the focused journey." },
    ];
    const screens = ["today", "lessons", "saved", "verb-list", "werken", "story", "notice", "dutch-map", "english-map", "practice", "complete"];
    const screenNames = { today: "Today", lessons: "Lessons", saved: "Saved", "verb-list": "Verb Journeys", werken: "Werken", story: "Story", notice: "Notice", "dutch-map": "8-form map", "english-map": "12 English forms", practice: "Practice", complete: "Complete" };
    const mapForms = [
      ["OTT", "onvoltooid tegenwoordige tijd", "Ik werk thuis.", "core"],
      ["VTT", "voltooid tegenwoordige tijd", "Ik heb thuis gewerkt.", "current"],
      ["OVT", "onvoltooid verleden tijd", "Ik werkte thuis.", "core"],
      ["VVT", "voltooid verleden tijd", "Ik had thuis gewerkt.", "later"],
      ["OTTT", "onvoltooid tegenwoordige toekomende tijd", "Ik zal thuis werken.", "later"],
      ["VTTT", "voltooid tegenwoordige toekomende tijd", "Ik zal thuis gewerkt hebben.", "reference"],
      ["OVTT", "onvoltooid verleden toekomende tijd", "Ik zou thuis werken.", "later"],
      ["VVTT", "voltooid verleden toekomende tijd", "Ik zou thuis gewerkt hebben.", "reference"],
    ];
    const questions = [
      { type: "choice", label: "1 · Meaning", title: "What does this report?", prompt: "Ik heb gisteren thuis gewerkt.", options: ["A weekly routine", "One completed event from yesterday", "A possible future plan"], answer: 1, good: "VTT commonly reports a completed conversational fact.", bad: "Look at gisteren and heb gewerkt: this reports a completed event." },
      { type: "slots", label: "2 · Build the form", title: "Tap the two missing parts", answer: ["heb", "gewerkt"], tokens: ["heb", "ben", "werk", "werkte", "gewerkt"], good: "Build the completed event with heb + gewerkt.", bad: "Use the auxiliary heb and the participle gewerkt." },
      { type: "choice", label: "3 · Natural Dutch", title: "Choose the best conversational answer", prompt: "A colleague asks: ‘What did you do yesterday?’", options: ["Ik werk gisteren thuis.", "Ik heb gisteren thuis gewerkt.", "Ik had gisteren thuis werken."], answer: 1, good: "VTT is the natural choice for this standalone completed event.", bad: "Choose Ik heb gisteren thuis gewerkt for this context." },
      { type: "choice", label: "4 · Verb Map", title: "Where does this sentence belong?", prompt: "Ik heb gisteren thuis gewerkt.", options: ["OTT · present", "VTT · completed present", "OVT · past routine", "VVT · earlier past"], answer: 1, good: "heb + gewerkt is VTT.", bad: "The present auxiliary heb plus gewerkt forms VTT." },

      const section = document.createElement("section"); section.className = "lesson-story"; section.innerHTML = `<p class="eyebrow">Notice the pattern · VTT</p><h1 class="subheading">The completed event</h1><p class="body-copy">Compare a routine with a completed fact.</p><div class="pattern-stack"><div class="pattern-line"><span class="tag">OTT</span><strong>Ik werk meestal thuis.</strong><span class="body-copy">routine / present situation</span></div><div class="pattern-line"><span class="tag orange">VTT</span><strong>Ik heb gisteren thuis gewerkt.</strong><span class="body-copy">completed conversational event</span></div></div><div class="notice">Dutch forms are not one-to-one copies of English tense labels. Context and time words matter.</div>`; body.append(section, actions(button("Back", () => setScreen("story"), "button secondary"), button("Place on 8-form map →", () => setScreen("dutch-map"), "button primary"))); content.append(body); return content;
