<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DutchMate Learn</title>
    <script type="module" src="./index.ts"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <img src="../../public/brand/dutchmate-mark.svg" alt="" width="29" height="29" />
          <span>DutchMate</span>
        </div>
        <div class="header-actions"><span id="due-badge" class="due-badge" role="status" hidden aria-label="Items due for review"></span><a class="header-link feedback-link" href="https://forms.gle/9KSsqfE1NNZcPEaaA" target="_blank" rel="noreferrer">Feedback</a><button id="settings-button" class="header-button" type="button" aria-label="Open settings">Settings</button></div>
      </header>
      <div id="popup-content" class="popup-content" role="tabpanel" tabindex="0" aria-labelledby="today-tab" aria-live="polite"></div>
      <nav id="primary-navigation" class="tabs" role="tablist" aria-label="Learning areas">
        <button id="today-tab" class="tab is-active" type="button" role="tab" aria-selected="true" tabindex="0"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z" /></svg></span><span>Today</span></button>
        <button id="lessons-tab" class="tab" type="button" role="tab" aria-selected="false" tabindex="-1"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Zm0 0V19" /></svg></span><span>Lessons</span></button>
        <button id="saved-tab" class="tab" type="button" role="tab" aria-selected="false" tabindex="-1"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M6 4.5A2.5 2.5 0 0 1 8.5 2H18v19l-5-3-5 3V4.5Z" /></svg></span><span>Saved</span></button>
      </nav>
    </main>
  </body>
</html>
